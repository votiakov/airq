# Keeps Go modules, base images (Dockerfile and compose) and pinned actions current.
# Commit prefixes follow Conventional Commits so the history stays uniform.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*", "github.com/exaring/otelpgx"]
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docker)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deploy)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
